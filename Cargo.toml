[workspace]
resolver = "2"
members = ["crates/*", "tools/webicons"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DabDavis/eqoa-rust-client-vanilla"

[workspace.dependencies]
ee = { path = "crates/ee" }
iso = { path = "crates/iso" }
esf = { path = "crates/esf" }
render = { path = "crates/render" }
vi = { path = "crates/vi" }
drdp = { path = "crates/drdp" }
net = { path = "crates/net" }
snd = { path = "crates/snd" }
dnas = { path = "crates/dnas" }
flate2 = "1"
crc32fast = "1"
serde_json = "1"
web-time = "1.1"

# dnas interprets ~300M EE instructions a module: optimized in debug and
# test builds too.
[profile.dev.package.dnas]
opt-level = 3
