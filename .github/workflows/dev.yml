name: Dev build

# Every push to master builds the client for Linux, Windows and macOS, and
# the Android app, and replaces the one release, `dev`: its tag is moved to
# the commit and its assets are replaced, and the run's own artifacts are
# deleted once they are up, so no older build stays downloadable. There are no
# versioned releases.

on:
  push:
    branches: [ "master" ]
    # Docs and the browser page are not the program.
    paths-ignore:
      - '**.md'
      - 'web/**'
  workflow_dispatch:

concurrency:
  # A newer push supersedes a build in flight.
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  # The toolchain the client is checked with locally.
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-2022
          - os: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.os }})
    env:
      # The updater follows this release from a build that carries the
      # channel and its commit (crates/eqoa/src/update.rs); a build made
      # anywhere else has neither and never updates itself.
      EQOA_UPDATE_CHANNEL: dev
      EQOA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          if [ "${{ matrix.os }}" = macos ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      # cpal (ALSA) and gilrs (libudev) link these; the window and the GPU
      # are opened at run time.
      - name: Install the Linux libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The tests that need the disc image, eqoa-port's oracles or a GPU
      # skip without them; the rest gate the build.
      - name: Test
        if: matrix.os == 'linux'
        run: cargo test --locked --workspace

      # This runner is an Apple silicon Mac: the EE arithmetic's four lanes
      # are NEON here (SSE2 on Linux's), and ee's tests hold them, and the
      # one-lane arithmetic under them, to the reference on the machine that
      # runs them (about 20 s).
      - name: Test the EE arithmetic (arm64)
        if: matrix.os == 'macos'
        run: cargo test --locked --release -p ee

      - name: Build
        if: matrix.os != 'macos'
        shell: bash
        run: cargo build --release --locked -p eqoa

      # A Windows program's main thread has the stack its header reserves,
      # and the game's first frame needs more than the 1 MB default
      # (crates/eqoa/build.rs): a build without 8 MB dies before it draws.
      # And a console program opens a terminal beside the game: the header
      # must say a Windows GUI program (main.rs's `windows_subsystem`).
      - name: Check the stack reserve and the subsystem (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $headers = & $dumpbin.FullName /headers target\release\eqoa.exe
          $line = ($headers | Select-String 'size of stack reserve').Line
          Write-Output $line
          if ($line -notmatch '^\s*800000 size of stack reserve') { throw 'eqoa.exe does not reserve an 8 MB stack' }
          $sub = ($headers | Select-String 'subsystem \(').Line
          Write-Output $sub
          if ($sub -notmatch '^\s*2 subsystem \(Windows GUI\)') { throw 'eqoa.exe is not a Windows GUI program: it would open a console window' }

      # One program for Apple silicon and Intel Macs.
      - name: Build (macOS, universal)
        if: matrix.os == 'macos'
        run: |
          cargo build --release --locked -p eqoa --target aarch64-apple-darwin
          cargo build --release --locked -p eqoa --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/eqoa \
            target/aarch64-apple-darwin/release/eqoa target/x86_64-apple-darwin/release/eqoa
          lipo -info target/release/eqoa

      # Two assets a platform: an archive with the README and the licence,
      # and the program on its own.
      - name: Package
        shell: bash
        run: |
          bin=target/release/eqoa
          [ "${{ matrix.os }}" = windows ] && bin=target/release/eqoa.exe
          # a program that does not carry its commit would not follow the
          # release; read as bytes, by perl on every runner (macOS's grep
          # found nothing in its build of af2b201, 2026-10-23)
          perl -e 'local $/; open my $f, "<:raw", $ARGV[0] or exit 2; my $b = <$f>; exit(index($b, $ENV{GITHUB_SHA}) < 0 ? 1 : 0)' "$bin" || {
            echo "$bin does not carry $GITHUB_SHA: it would not update itself"
            LC_ALL=C grep -ac "$GITHUB_SHA" "$bin" || true
            exit 1
          }
          case "${{ matrix.os }}" in
            linux) name=eqoa-vanilla-linux-x86_64 ;;
            windows) name=eqoa-vanilla-windows-x86_64 ;;
            macos) name=eqoa-vanilla-macos ;;
          esac
          mkdir -p "dist/$name" out
          if [ "${{ matrix.os }}" = windows ]; then
            cp target/release/eqoa.exe "dist/$name/"
            # Windows Notepad reads the text with Windows line ends
            sed 's/$/\r/' release/README.txt > "dist/$name/README.txt"
            sed 's/$/\r/' LICENSE > "dist/$name/LICENSE.txt"
            (cd dist && 7z a -tzip "../out/$name.zip" "$name" > /dev/null)
            cp target/release/eqoa.exe "out/$name.exe"
          else
            cp target/release/eqoa "dist/$name/"
            chmod +x "dist/$name/eqoa"
            cp release/README.txt LICENSE "dist/$name/"
            # Linux: the program's icon, the drawn disc, for a desktop entry of
            # the player's own (Wayland shows a program's icon only through one)
            if [ "${{ matrix.os }}" = linux ]; then
              target/release/eqoa icon 256 "dist/$name/eqoa.png" || echo "no eqoa.png: the archive goes without it"
            fi
            tar -C dist -czf "out/$name.tar.gz" "$name"
            cp target/release/eqoa "out/$name"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: out/
          # deleted by the publish job; a day at most if it never runs
          retention-days: 1
          if-no-files-found: error

  # The Android app (android/build.sh, README "Android"): one APK for phones
  # and tablets (arm64-v8a) and the emulator and Chromebooks (x86_64), built
  # with the SDK's own tools at the versions given here, and signed with the
  # project's key (secrets ANDROID_KEYSTORE, the keystore in base64, and
  # ANDROID_KEYSTORE_PASSWORD): Android installs an APK over an older one only
  # when both carry the same key. It never updates itself (update.rs), so it
  # has no line in update.txt.
  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
      ANDROID_BUILD_TOOLS: 37.0.0
      ANDROID_PLATFORM: android-36
    steps:
      # the version code is the commit's place in master's history (build.sh)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the SDK's parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;$ANDROID_PLATFORM" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "no ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASSWORD secret: an APK signed with another key would not install over the release's"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/key"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/key/eqoa.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/key/eqoa.jks.pass"
          echo "EQOA_ANDROID_KEYSTORE=$RUNNER_TEMP/key/eqoa.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p out
          bash android/build.sh --locked --abi arm64-v8a,x86_64 --out out/eqoa-vanilla-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/eqoa-vanilla-android.apk
          # deleted by the publish job; a day at most if it never runs
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, android]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # the history and the tags: the notes tell this build from the last
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The build, its downloads and the update notes (release/notes.sh: what
      # each build changed, UPDATE-NOTES.md's sections; this build's are the
      # ones the previous build, which the dev tag still names, did not have).
      - name: Write the release notes
        run: |
          prev=$(git rev-parse -q --verify 'refs/tags/dev^{commit}' || true)
          bash release/notes.sh "$GITHUB_SHA" "$prev" > notes.md
          cat notes.md
          ls -la dist

      # The updater's manifest (crates/eqoa/src/update.rs): the commit, and a
      # line a platform with its program, the SHA-256 and the size a download
      # is held to.
      - name: Write update.txt
        run: |
          {
            echo "version dev-${GITHUB_SHA::7}"
            echo "commit $GITHUB_SHA"
            for b in linux-x86_64:eqoa-vanilla-linux-x86_64 windows-x86_64:eqoa-vanilla-windows-x86_64.exe macos:eqoa-vanilla-macos; do
              f="dist/${b#*:}"
              echo "build ${b%%:*} ${b#*:} $(sha256sum "$f" | cut -d' ' -f1) $(stat -c%s "$f")"
            done
          } > update.txt
          cat update.txt

      # The update notes as the game reads them (crates/eqoa/src/update.rs's
      # NOTES_FILE): UPDATE-NOTES.md beside the programs, uploaded with them,
      # before update.txt, so a game that reads the new manifest finds the
      # notes that go with it and shows the sections its own copy lacks.
      - name: The update notes for the game
        run: |
          cp UPDATE-NOTES.md dist/update-notes.md
          grep -c '^## ' dist/update-notes.md

      # The tag is moved, not added to, so the release always describes the
      # tip of master and nothing else.
      - name: Publish
        run: |
          git tag --force dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev
          gh release view dev > /dev/null 2>&1 || \
            gh release create dev --prerelease --title "Dev build" --notes-file notes.md
          # an asset no longer built goes too
          for old in $(gh release view dev --json assets --jq '.assets[].name'); do
            [ -e "dist/$old" ] || [ "$old" = update.txt ] || gh release delete-asset dev "$old" --yes
          done
          gh release upload dev --clobber dist/*
          # the manifest after the programs it names and the notes (both in
          # dist/): a game reading it finds them there (one that reads the
          # old one meanwhile is refused the new program by its hash, and
          # asks again at its next look)
          gh release upload dev --clobber update.txt
          gh release edit dev --prerelease --title "Dev build" --notes-file notes.md

  # The run's own copies of the builds would be a second place to download
  # one: gone once the release has them, or the run failed, or was replaced.
  cleanup:
    needs: [build, android, publish]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the run's artifacts
        run: |
          for id in $(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
