[package]
name = "eqoa"
description = "The EQOA Rust client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso.workspace = true
esf.workspace = true
ee.workspace = true
render.workspace = true
vi.workspace = true
net.workspace = true
snd.workspace = true
web-time.workspace = true
winit = "0.30.13"
pollster = "1.0.1"
glam = "0.34.1"
png = "0.18.1"
cpal = "0.16"

# The browser build (`web/build.sh`): the page hands over the player's disc
# image and the login; sockets go through a WebSocket relay; wgpu falls back
# to WebGL2 where there is no WebGPU; CLIENT's image (the start menu) is
# unpacked off the disc by `dnas`, in a worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dnas.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
console_error_panic_hook = "0.1.7"
wgpu = { version = "30.0.1", features = ["webgl"] }
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BinaryType",
    "CloseEvent",
    "console",
    "Document",
    "Element",
    "Event",
    "File",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Performance",
    "WebSocket",
    "Window",
] }
