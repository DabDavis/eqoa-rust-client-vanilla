[package]
name = "eqoa"
description = "The EQOA Rust client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso.workspace = true
dnas.workspace = true
esf.workspace = true
ee.workspace = true
render.workspace = true
vi.workspace = true
net.workspace = true
snd.workspace = true
web-time.workspace = true
# the patcher's files (`patcher::http`): gzip's deflate, and zlib's CRC-32
flate2.workspace = true
winit = "0.30.13"
pollster = "1.0.1"
glam = "0.34.1"
png = "0.18.1"
cpal = "0.16"

# The gamepads natively (SDL's layout, force feedback); a page reads the
# Gamepad API itself (`padmap`, `web::pad`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11.2"
# The disc image's picker (`discs::settle`): the desktop's own file dialog,
# Windows' common dialog, a Mac's open panel, on Linux the XDG desktop portal
# (libdbus, opened at run time) or else zenity. Nothing more is linked.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The updater (`update`) and the reports (`report`): HTTPS to the GitHub
# release and to the report server (rustls on ring, Mozilla's roots built in),
# and a download held to the SHA-256 its manifest names.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"

# The log's pipe (`report`): stderr duplicated and replaced.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Windows' Xbox controllers through XInput (`xinput`), which answers a window
# that is not in front, as Windows.Gaming.Input (gilrs's) does not; and the
# terminal a program run from one writes to (`attach_console`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_XboxController"] }

# The browser build (`web/build.sh`): the page hands over the player's disc
# image and the login; sockets go through a WebSocket relay; wgpu falls back
# to WebGL2 where there is no WebGPU; CLIENT and SUPPORT are unpacked off the
# disc by `dnas` in the page's workers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
console_error_panic_hook = "0.1.7"
wgpu = { version = "30.0.1", features = ["webgl"] }
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BinaryType",
    "CloseEvent",
    "console",
    "Document",
    "Element",
    "Event",
    "File",
    "Gamepad",
    "GamepadButton",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Performance",
    "Response",
    "Storage",
    "WebSocket",
    "Window",
] }

# Tests that read what the client sent (its datagrams' guaranteed messages).
[dev-dependencies]
drdp.workspace = true
