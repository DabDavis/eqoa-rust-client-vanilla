[package]
name = "voice"
description = "Group voice for the native client: WebRTC through a TURN relay, Opus, the microphone"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
opus = "0.4.0"
cpal = "0.16"
serde_json.workspace = true
bytes = "1"

# the ignored end-to-end test's way to the voice server's demo WebSocket (src/live.rs); the
# version the game's own demo client takes
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
