[package]
name = "render"
description = "The wgpu renderer: models, textures, the camera"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
esf.workspace = true
glam = "0.34.1"
# `counters`: the device counts its buffers and bind groups and the bytes
# under its buffers and textures, which a report's memory line reads (the
# client's `mem`): an atomic add as one is made or let go, nothing a frame.
wgpu = { version = "30.0.1", features = ["counters"] }
web-time.workspace = true

[dev-dependencies]
iso.workspace = true
pollster = "1.0.1"
