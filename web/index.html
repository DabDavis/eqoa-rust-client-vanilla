<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EQOA</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d10; --panel: #151a20; --line: #2a323c; --text: #e6e9ee; --dim: #9aa4b1; --accent: #d9a441; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas#eqoa { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
  #panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow: auto; }
  form { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
  p.lede { margin: 0 0 16px; color: var(--dim); font-size: 13px; }
  label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 13px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; background: #0e1217; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input[type=file] { padding: 7px; }
  details { margin-top: 14px; color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button { flex: 1; padding: 10px; font: inherit; font-weight: 600; border-radius: 6px; border: 1px solid var(--line); background: #1e252e; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #status { position: fixed; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="eqoa" tabindex="0"></canvas>
<div id="panel">
  <form id="form" autocomplete="on">
    <h1>EverQuest Online Adventures</h1>
    <p class="lede">A client in your browser, from your own <i>Frontiers</i> disc image. The image stays on your computer: it is read here, never uploaded.</p>
    <label for="iso">Disc image (SLUS-20744, .iso)</label>
    <input id="iso" type="file" accept=".iso,.bin,.img" required>
    <label for="user">Account</label>
    <input id="user" name="username" autocomplete="username" required>
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <label for="character">Character (blank: the first)</label>
    <input id="character">
    <details>
      <summary>Server and viewer</summary>
      <label for="relay">Relay</label>
      <input id="relay" placeholder="wss://host/eqoa/relay">
      <label for="server">Game server address (IPv4; blank: this page's host)</label>
      <input id="server">
      <label for="viewargs">Offline viewer: file and what to show</label>
      <input id="viewargs" placeholder="CHAR.ESF 0x70D898C6 · LAVASTM.ESF walk 0">
    </details>
    <div class="row">
      <button type="button" id="view">View offline</button>
      <button type="submit" id="play" class="primary">Play</button>
    </div>
    <div class="note">WASD walks, arrows turn the camera, Tab targets, Space attacks, Enter chats, Escape opens the menu.</div>
  </form>
</div>
<div id="status">loading…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
