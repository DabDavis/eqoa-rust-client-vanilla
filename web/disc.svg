<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The page's icon: the program's own drawn disc (crates/eqoa/src/icon_art.rs), its
       parts at the same shares of its radius. No game art. -->
  <defs>
    <radialGradient id="data" cx="32" cy="32" r="29.6" gradientUnits="userSpaceOnUse">
      <stop offset="0.43" stop-color="#0c1840"/>
      <stop offset="1" stop-color="#22408f"/>
    </radialGradient>
    <radialGradient id="sheen" cx="32" cy="32" r="29.6" gradientUnits="userSpaceOnUse">
      <stop offset="0.43" stop-color="#7fd3ff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#8fc8ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b9a2ff" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#bfc8d6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c0f2"/>
      <stop offset="0.5" stop-color="#3a59b0"/>
      <stop offset="1" stop-color="#a9c0f2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="dataside">
      <circle cx="32" cy="32" r="29.6"/>
    </clipPath>
    <mask id="hole">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="4.88" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <circle cx="32" cy="32" r="31.5" fill="#0a0f1f"/>
    <circle cx="32" cy="32" r="30.8" fill="url(#rim)"/>
    <circle cx="32" cy="32" r="29.6" fill="url(#data)"/>
    <!-- the light from the top left: a streak through the centre, softened -->
    <g clip-path="url(#dataside)">
      <path d="M32 32 L4.2 22.2 A29.6 29.6 0 0 1 22.2 4.2 Z M32 32 L59.8 41.8 A29.6 29.6 0 0 1 41.8 59.8 Z" fill="url(#sheen)" filter="url(#soft)"/>
    </g>
    <circle cx="32" cy="32" r="12.76" fill="#08112c"/>
    <circle cx="32" cy="32" r="12.13" fill="#bccadb" fill-opacity="0.82"/>
    <circle cx="32" cy="32" r="9.92" fill="#66748c"/>
    <circle cx="32" cy="32" r="9.29" fill="url(#hub)"/>
    <circle cx="32" cy="32" r="5.99" fill="#56637a"/>
  </g>
</svg>
